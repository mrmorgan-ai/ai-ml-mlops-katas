# ===== WORKFLOW NAME =====
# Displayed in GitHub Actions tab
name: ML Pipeline CI

# ===== TRIGGERS =====
# When should this workflow run?
on:
  push:
    branches: [develop]  # Run on pushes to main or develop
  pull_request:
    branches: [main]           # Run on PRs targeting main

# ===== ENV VARIABLES =====
env:
  AZURE_SUBSCRIPTION_AI_ID: f092ec91-9aec-43f8-bc82-71bca6f71a9f
  AZURE_SUBSCRIPTION_BAQA_ID: 70f2f65a-12ef-4b71-a962-95e11d7a86ff
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}       # Pre-populated in your GH Org.
  AZURE_CLIENT_ID: 0a28b8c0-5f40-4b78-b226-aa47373a25ce

# ===== PERMISSIONS =====
permissions:
  id-token: write                   # Setting the workflow permission for id-token
  contents: read

# ===== JOBS =====
# Each job runs independently (can run in parallel)
jobs:
    # ===== JOB 1: Code Quality =====
    code-quality:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
    
        - name: Install linters
          run: pip install flake8 black isort mypy
        
        - name: Check formatting with Black
          run: black --check src/ tests/
          # Fails if code isn't formatted correctly
        
        - name: Check import sorting
          run: isort --check-only src/ tests/
          # Fails if imports aren't sorted
        
        - name: Lint with flake8
          run: flake8 src/ tests/
          # Fails on syntax errors, undefined names, etc.
        
        - name: Type check with mypy
          run: mypy src/
          # Fails on type annotation errors
    
    # ===== JOB 2: Unit Tests =====
    unit-tests:
        runs-on: ubuntu-latest
        needs: code-quality  # Only run if code-quality passes
    
        steps:
        - uses: actions/checkout@v4
        
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        
        - name: Install dependencies
          run: |
            pip install -r requirements.txt
            pip install pytest pytest-cov
        
        - name: Run unit tests
          run: pytest tests/ -v --cov=src --cov-report=xml
            # Runs all tests in tests/ folder
            # -v: verbose output
            # --cov=src: measure coverage of src/ folder
            # --cov-report=xml: generate XML report for coverage tools
        
        - name: Check coverage threshold
          run: |
            coverage report --fail-under=80
            
        # Fails if coverage is below 80%
    # ===== STAGE 3: Data Validation =====
    data-validation:
        runs-on: ubuntu-latest
        needs: unit-tests
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            
        - run: pip install -r requirements.txt

        - name: Validate data schema
          run: python scripts/validate_data.py

        - name: Check data drift
          run: python scripts/check_drift.py

    # ===== STAGE 4: Model Training & Validation =====
    model-validation:
        runs-on: ubuntu-latest
        needs: data-validation
        steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - run: pip install -r requirements.txt

        - name: Train model
          run: python scripts/train.py

        - name: Test model behavior
          run: pytest tests/test_model_behavior.py -v

        - name: Compare to baseline
          run: python scripts/compare_models.py
          
        - uses: actions/upload-artifact@v3
          with:
            name: model
            path: models/candidate.joblib

    # ===== STAGE 5: Deploy (only on main) =====
    deploy:
        runs-on: ubuntu-latest
        needs: model-validation
        if: github.ref == 'refs/heads/main'  # Only deploy from main branch
        steps:
        - uses: actions/checkout@v4

        - uses: actions/download-artifact@v3
          with:
            name: model

        - name: Deploy to production
          run: |
            echo "Deploying model to production..."
            # Your deployment script here
